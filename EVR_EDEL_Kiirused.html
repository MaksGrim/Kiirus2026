<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EVR + Edelaraudtee Kiirused</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #162032;
    --card-border: #26354d;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.14);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, 0.12);
    --edel: #fb923c;
    --edel-bg: rgba(251, 146, 60, 0.16);
    --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
    padding-bottom: 40px;
  }
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 17, 32, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--card-border);
    padding: 12px 14px 10px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }
  .title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--accent);
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
  }
  .mode-switch {
    display: flex;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 2px;
  }
  .mode-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #0b1120;
  }
  .search-wrap {
    position: relative;
  }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    color: var(--text);
    font-size: 17px;
    padding: 11px 38px 11px 14px;
    border-radius: 12px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: #26354d;
    border: none;
    color: var(--text);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: none;
  }
  .dropdown {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    margin-top: 4px;
    background: #1a2639;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    max-height: 280px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 12px 28px rgba(0,0,0,0.6);
    display: none;
  }
  .drop-item {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .drop-item:last-child { border-bottom: none; }
  .drop-item:active { background: var(--accent-bg); }
  .drop-name { font-size: 16px; font-weight: 600; }
  .drop-tags { display: flex; gap: 5px; flex-shrink: 0; }
  .drop-tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
  }
  .drop-tag.edel {
    background: var(--edel-bg);
    color: var(--edel);
    font-weight: 700;
  }
  .drop-tag.evr {
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 700;
  }
  .container {
    padding: 12px 14px;
    max-width: 680px;
    margin: 0 auto;
  }
  .recent-box {
    margin-bottom: 14px;
  }
  .section-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .chip.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .loc-header {
    margin: 6px 0 12px;
    padding: 12px 14px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .loc-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .loc-title {
    font-size: 21px;
    font-weight: 800;
    color: #fff;
  }
  .infra-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .infra-pill.evr { background: var(--accent-bg); color: var(--accent); }
  .infra-pill.edel { background: var(--edel-bg); color: var(--edel); }
  .loc-dir {
    font-size: 12px;
    color: var(--accent);
    margin-top: 3px;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 14px;
  }
  .f-btn {
    background: var(--card);
    border: 1.5px solid var(--card-border);
    color: var(--text);
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .f-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1120;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .card-type {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-dir-tag {
    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 7px;
    border-radius: 5px;
  }
  .km-badge {
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
    padding: 4px 8px;
    border-radius: 7px;
    white-space: nowrap;
    color: var(--accent);
  }
  .speed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .speed-box {
    background: rgba(11, 17, 32, 0.65);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 9px 11px;
  }
  .speed-box.highlight {
    border-color: rgba(56, 189, 248, 0.35);
    background: rgba(56, 189, 248, 0.06);
  }
  .speed-box.full {
    grid-column: span 2;
  }
  .speed-box.side {
    grid-column: span 2;
    border-color: rgba(251, 191, 36, 0.35);
    background: var(--warn-bg);
  }
  .s-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .side .s-label {
    color: var(--warn);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .s-val {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
  }
  .s-unit {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .split-pair {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }
  .sp-chip {
    flex: 1;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 7px;
    padding: 4px 7px;
    display: flex;
    flex-direction: column;
  }
  .sp-tag {
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .sp-num {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
  }
  .side-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .side-item {
    background: rgba(0, 0, 0, 0.32);
    border: 1px solid rgba(251, 191, 36, 0.18);
    border-radius: 8px;
    padding: 6px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .side-name {
    font-size: 13px;
    font-weight: 700;
    color: #fde68a;
    white-space: nowrap;
  }
  .side-pills {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .t-badge {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    background: rgba(255, 255, 255, 0.07);
    padding: 2px 7px;
    border-radius: 5px;
  }
  .t-k {
    font-size: 10px;
    color: #fcd34d;
    opacity: 0.85;
  }
  .t-v {
    font-size: 14px;
    font-weight: 800;
    color: #fff;
  }
  .note-box {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(248, 113, 113, 0.12);
    border-left: 3px solid var(--danger);
    font-size: 13px;
    color: #fecaca;
  }
  .edel-footer {
    margin-top: 14px;
    padding: 12px 14px;
    background: rgba(251, 146, 60, 0.08);
    border: 1px solid rgba(251, 146, 60, 0.28);
    border-radius: 12px;
    font-size: 12px;
    color: #fed7aa;
  }
  .edel-footer b { color: var(--edel); }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="header">
  <div class="top-bar">
    <div>
      <div class="title">EVR + Edelaraudtee</div>
      <div class="subtitle">EVR 11-1/8 • EDEL KK-28</div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="btnFreight" onclick="setTrainMode('freight')">Грузовой</button>
      <button class="mode-btn" id="btnAll" onclick="setTrainMode('all')">Все поезда</button>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="Станция или перегон (Tamsalu, Kohila, Pärnu)..." autocomplete="off">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
    <div class="dropdown" id="dropdown"></div>
  </div>
</div>

<div class="container">
  <div class="recent-box" id="recentBox">
    <div class="section-label">Быстрый выбор / Недавние</div>
    <div class="chips" id="recentChips"></div>
  </div>

  <div id="contentArea">
    <div class="empty-state">
      Введите название станции выше (например, <b>Tamsalu</b>, <b>Kohila</b>, <b>Rapla</b>, <b>Pärnu</b>, <b>Viljandi</b>) или выберите из списка.
    </div>
  </div>
</div>

const TYPE_RU = {
  "peatee": "Главный путь перегона",
  "jaama peatee": "Главный путь станции",
  "jaamatee": "Станционный путь",
  "I kõrik": "I горловина (прямой ход)",
  "II kõrik": "II горловина (прямой ход)",
  "keskkõrik": "Центральная горловина"
};

let trainMode = localStorage.getItem("evr_mode") || "freight";
let currentLocation = null;
let currentFilter = "ALL";
let recentList = JSON.parse(localStorage.getItem("evr_recent_v2") || '["Tamsalu","Tapa","Kohila","Rapla","Tootsi","Pärnu","Viljandi","Liiva"]');

const locationsMap = new Map();
DB.forEach(item => {
  if (!locationsMap.has(item.loc)) {
    locationsMap.set(item.loc, {
      name: item.loc,
      isStation: item.st === 1,
      infras: new Set([item.infra || "EVR"]),
      dirs: new Set(item.dirs || [])
    });
  } else {
    const entry = locationsMap.get(item.loc);
    entry.infras.add(item.infra || "EVR");
    (item.dirs || []).forEach(d => entry.dirs.add(d));
  }
});
const allLocations = Array.from(locationsMap.values());

function setTrainMode(mode) {
  trainMode = mode;
  localStorage.setItem("evr_mode", mode);
  document.getElementById("btnFreight").classList.toggle("active", mode === "freight");
  document.getElementById("btnAll").classList.toggle("active", mode === "all");
  if (currentLocation) renderLocation(currentLocation);
}

function translateType(t) {
  if (TYPE_RU[t]) return TYPE_RU[t];
  return t
    .replace("jaama peatee", "Главный путь")
    .replace("jaamatee", "Путь")
    .replace("I kõrik", "I горловина")
    .replace("II kõrik", "II горловина")
    .replace("keskkõrik", "Центральная горловина")
    .replace("peatee", "Главный путь")
    .replace("tee", "путь");
}

function getShortLabel(item) {
  if (item.type === "jaamatee") return `${item.trk} путь`;
  if (item.type.startsWith("jaama peatee")) return `Гл. путь ${item.trk || ""}`.trim();
  if (item.type.startsWith("I kõrik")) return item.trk ? `I горл. (${item.trk})` : "I горловина";
  if (item.type.startsWith("II kõrik")) return item.trk ? `II горл. (${item.trk})` : "II горловина";
  if (item.type.startsWith("keskkõrik")) return item.trk ? `Центр. горл. (${item.trk})` : "Центр. горловина";
  if (item.type === "peatee") return "Перегон";
  return `${item.type} ${item.trk}`.trim();
}

function formatSpeedValue(val, note) {
  if (!val || val === "-") return `<div class="s-val">—</div>`;
  if (val.includes("/")) {
    const parts = val.split("/").map(s => s.trim());
    if (parts.length === 2) {
      const nLower = (note || "").toLowerCase();
      let lbl1 = "Приб.";
      let lbl2 = "Отпр.";
      if (nLower.includes("peatuskohta")) {
        lbl1 = "На о.п.";
        lbl2 = "С о.п.";
      } else if (nLower.includes("jaama saabuv")) {
        lbl1 = "Приём";
        lbl2 = "Отпр.";
      }
      return `
        <div class="split-pair">
          <div class="sp-chip">
            <span class="sp-tag">${lbl1}</span>
            <span class="sp-num">${parts[0]}</span>
          </div>
          <div class="sp-chip">
            <span class="sp-tag">${lbl2}</span>
            <span class="sp-num">${parts[1]}</span>
          </div>
        </div>
      `;
    }
  }
  return `<div class="s-val">${val} <span class="s-unit">км/ч</span></div>`;
}

// Форматирование горловин для EVR (>25т / <=25т / пасс)
function formatSideRowEVR(label, val) {
  if (!val || val === "-") return "";
  const parts = val.split("/").map(s => s.trim());
  if (parts.length === 3) {
    const p0 = parts[0] === "-" ? "—" : parts[0];
    const p1 = parts[1] === "-" ? "—" : parts[1];
    const p2 = parts[2] === "-" ? "—" : parts[2];
    const passBadge = trainMode === "all"
      ? `<span class="t-badge"><span class="t-k">пасс</span><span class="t-v">${p2}</span></span>`
      : "";
    return `
      <div class="side-item">
        <span class="side-name">${label}</span>
        <div class="side-pills">
          <span class="t-badge"><span class="t-k">&gt;25т</span><span class="t-v">${p0}</span></span>
          <span class="t-badge"><span class="t-k">≤25т</span><span class="t-v">${p1}</span></span>
          ${passBadge}
        </div>
      </div>
    `;
  }
  return `
    <div class="side-item">
      <span class="side-name">${label}</span>
      <div class="side-pills"><span class="t-badge"><span class="t-v">${val}</span></span></div>
    </div>
  `;
}

// Форматирование горловин для Edelaraudtee (reisirong / kaubarong или одно число)
function formatSideRowEDEL(label, val) {
  if (!val || val === "-") return "";
  if (val.includes("/")) {
    const parts = val.split("/").map(s => s.trim());
    if (parts.length === 2) {
      const pPass = parts[0];
      const pFreight = parts[1];
      const passBadge = trainMode === "all"
        ? `<span class="t-badge"><span class="t-k">пасс</span><span class="t-v">${pPass}</span></span>`
        : "";
      return `
        <div class="side-item">
          <span class="side-name">${label}</span>
          <div class="side-pills">
            <span class="t-badge"><span class="t-k">груз</span><span class="t-v">${pFreight}</span></span>
            ${passBadge}
          </div>
        </div>
      `;
    }
  }
  return `
    <div class="side-item">
      <span class="side-name">${label}</span>
      <div class="side-pills">
        <span class="t-badge"><span class="t-k">все</span><span class="t-v">${val}</span></span>
      </div>
    </div>
  `;
}

function renderRecent() {
  const box = document.getElementById("recentChips");
  box.innerHTML = "";
  recentList.slice(0, 8).forEach(name => {
    if (!locationsMap.has(name)) return;
    const btn = document.createElement("button");
    btn.className = "chip" + (currentLocation === name ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => selectLocation(name);
    box.appendChild(btn);
  });
}

function selectLocation(name) {
  currentLocation = name;
  currentFilter = "ALL";
  document.getElementById("searchInput").value = name;
  document.getElementById("clearBtn").style.display = "block";
  document.getElementById("dropdown").style.display = "none";
  
  recentList = [name, ...recentList.filter(x => x !== name)].slice(0, 10);
  localStorage.setItem("evr_recent_v2", JSON.stringify(recentList));
  renderRecent();
  renderLocation(name);
}

function clearSearch() {
  const inp = document.getElementById("searchInput");
  inp.value = "";
  document.getElementById("clearBtn").style.display = "none";
  document.getElementById("dropdown").style.display = "none";
  inp.focus();
}

function renderLocation(name) {
  const items = DB.filter(r => r.loc === name);
  if (!items.length) return;
  
  const info = locationsMap.get(name);
  const allDirsStr = Array.from(info.dirs).join(" • ");
  const isJunction = info.dirs.size > 1;
  const labels = Array.from(new Set(items.map(getShortLabel)));
  const hasEdel = info.infras.has("EDEL");
  const hasEvr = info.infras.has("EVR");
  
  let infraBadges = "";
  if (hasEvr) infraBadges += `<span class="infra-pill evr">Eesti Raudtee</span>`;
  if (hasEdel) infraBadges += `<span class="infra-pill edel">Edelaraudtee</span>`;
  
  let html = `
    <div class="loc-header">
      <div class="loc-title-row">
        <div class="loc-title">${name}</div>
        <div style="display:flex;gap:5px;">${infraBadges}</div>
      </div>
      <div class="loc-dir">${allDirsStr}</div>
    </div>
  `;
  
  if (labels.length > 1) {
    html += `<div class="filter-bar">`;
    html += `<button class="f-btn ${currentFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">Все (${items.length})</button>`;
    labels.forEach(lbl => {
      const isAct = currentFilter === lbl ? "active" : "";
      html += `<button class="f-btn ${isAct}" onclick="setFilter('${lbl.replace(/'/g, "\\'")}')">${lbl}</button>`;
    });
    html += `</div>`;
  }
  
  const filtered = currentFilter === "ALL" ? items : items.filter(i => getShortLabel(i) === currentFilter);
  
  filtered.forEach(item => {
    const isEdel = item.infra === "EDEL";
    const titleRu = translateType(item.type) + (item.trk ? ` № ${item.trk}` : "");
    const titleEt = `${item.type} ${item.trk}`.trim();
    const kmBadge = (item.km1 || item.km2) ? `${item.km1} – ${item.km2} км` : "";
    const showCardDir = isJunction && item.dirs && item.dirs.length === 1;
    
    let sideHtml = "";
    if (isEdel) {
      sideHtml = [
        formatSideRowEDEL("Нечёт. горл. (Paaritu)", item.s_I),
        formatSideRowEDEL("Чёт. горл. (Paaris)", item.s_II)
      ].filter(Boolean).join("");
    } else {
      sideHtml = [
        formatSideRowEVR("I горловина", item.s_I),
        formatSideRowEVR("Центр. горл.", item.s_k),
        formatSideRowEVR("II горловина", item.s_II)
      ].filter(Boolean).join("");
    }
    
    html += `<div class="card">`;
    html += `
      <div class="card-top">
        <div>
          <div class="card-type">${titleRu}</div>
          <div class="card-sub">${titleEt}</div>
          ${showCardDir ? `<div class="card-dir-tag">${item.dirs[0]}</div>` : ""}
        </div>
        ${kmBadge ? `<div class="km-badge">${kmBadge}</div>` : ""}
      </div>
    `;
    
    html += `<div class="speed-grid">`;
    
    if (isEdel) {
      // Для Edelaraudtee единая грузовая скорость (без разделения >25т / <=25т)
      const gridClass = trainMode === "all" ? "speed-box highlight" : "speed-box highlight full";
      html += `
        <div class="${gridClass}">
          <div class="s-label">Грузовой (Kaubarong)</div>
          ${formatSpeedValue(item.f_o25, item.note)}
        </div>
      `;
      if (trainMode === "all") {
        html += `
          <div class="speed-box">
            <div class="s-label">Пассажирский (Reisirong)</div>
            ${formatSpeedValue(item.p_oth, item.note)}
          </div>
        `;
      }
      if (sideHtml) {
        html += `<div class="speed-box side">`;
        html += `<div class="s-label">Скорости в горловинах (Jaamakõrikud)</div>`;
        html += `<div class="side-list">${sideHtml}</div>`;
        html += `</div>`;
      }
    } else {
      // Для Eesti Raudtee (>25т / <=25т + боковые)
      html += `
        <div class="speed-box highlight">
          <div class="s-label">Грузовой &gt; 25 т/ось</div>
          ${formatSpeedValue(item.f_o25, item.note)}
        </div>
        <div class="speed-box highlight">
          <div class="s-label">Грузовой ≤ 25 т/ось</div>
          ${formatSpeedValue(item.f_u25, item.note)}
        </div>
      `;
      if (sideHtml) {
        html += `<div class="speed-box side">`;
        html += `<div class="s-label">На боковой путь (по нагрузке на ось)</div>`;
        html += `<div class="side-list">${sideHtml}</div>`;
        html += `</div>`;
      }
      if (trainMode === "all") {
        html += `
          <div class="speed-box">
            <div class="s-label">Пасс. DMU / EMU</div>
            ${formatSpeedValue(item.p_dmu || item.p_emu, item.note)}
          </div>
          <div class="speed-box">
            <div class="s-label">Пасс. прочие (локом.)</div>
            ${formatSpeedValue(item.p_oth, item.note)}
          </div>
        `;
      }
    }
    
    html += `</div>`;
    
    if (item.note) {
      html += `<div class="note-box">⚠️ ${item.note}</div>`;
    }
    
    html += `</div>`;
  });
  
  if (hasEdel) {
    html += `
      <div class="edel-footer">
        <b>Общие правила Edelaraudtee AS (EDI-2026-KK-28):</b><br>
        1. Не превышать конструкционную скорость подвижного состава.<br>
        2. Снегоочиститель: в работе до <b>50 км/ч</b>, в транспортном положении — по скорости грузового поезда.<br>
        3. На станционных путях, не указанных в таблице, максимальная скорость — до <b>15 км/ч</b>.
      </div>
    `;
  }
  
  document.getElementById("contentArea").innerHTML = html;
}

function setFilter(lbl) {
  currentFilter = lbl;
  renderLocation(currentLocation);
}

const searchInput = document.getElementById("searchInput");
const dropdown = document.getElementById("dropdown");

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  document.getElementById("clearBtn").style.display = q ? "block" : "none";
  
  if (!q) {
    dropdown.style.display = "none";
    return;
  }
  
  const matches = allLocations
    .filter(l => l.name.toLowerCase().includes(q))
    .sort((a, b) => {
      const aStarts = a.name.toLowerCase().startsWith(q) ? 0 : 1;
      const bStarts = b.name.toLowerCase().startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      if (a.isStation !== b.isStation) return a.isStation ? -1 : 1;
      return a.name.localeCompare(b.name);
    })
    .slice(0, 25);
    
  if (!matches.length) {
    dropdown.innerHTML = `<div class="drop-item"><span class="drop-name" style="color:var(--muted)">Ничего не найдено</span></div>`;
  } else {
    dropdown.innerHTML = matches.map(m => {
      const infraTag = m.infras.has("EDEL")
        ? `<span class="drop-tag edel">EDEL</span>`
        : `<span class="drop-tag evr">EVR</span>`;
      return `
        <div class="drop-item" onclick="selectLocation('${m.name.replace(/'/g, "\\'")}')">
          <span class="drop-name">${m.name}</span>
          <div class="drop-tags">
            ${infraTag}
            <span class="drop-tag">${m.isStation ? "Станция" : "Перегон"}</span>
          </div>
        </div>
      `;
    }).join("");
  }
  dropdown.style.display = "block";
});

searchInput.addEventListener("focus", () => {
  if (searchInput.value.trim()) {
    searchInput.dispatchEvent(new Event("input"));
  }
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) {
    dropdown.style.display = "none";
  }
});

setTrainMode(trainMode);
renderRecent();
</script>
